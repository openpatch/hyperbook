# Hyperbook Cloud.
#
#   cp .env.example .env    # then edit it — the server refuses to start
#   docker compose up -d    # without ADMIN_ORIGIN, BOOKS_DOMAIN and CREDENTIALS_KEY
#
# To update:
#
#   docker compose pull && docker compose up -d

services:
  cloud:
    # Pin a release rather than tracking latest, so an update is something you
    # choose. Tags are published per release: ghcr.io/openpatch/hyperbook-cloud:<version>
    image: ghcr.io/openpatch/hyperbook-cloud:latest
    # To run your own build instead of the published image, comment out `image`
    # above and uncomment this. The context is the repository root.
    # build:
    #   context: ../..
    #   dockerfile: platforms/cloud/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Inside the container this path is on the volume below. Overriding it in
      # .env would put the data in the container's writable layer, where the
      # next update destroys it.
      DATA_DIR: /data
    ports:
      # Bound to localhost: put a reverse proxy in front for TLS. It must pass
      # the Host header through unchanged (Caddy and nginx's proxy_set_header
      # Host $host both do), because the server tells books apart by it.
      - "127.0.0.1:3001:3001"
    volumes:
      - cloud-data:/data

volumes:
  # Named, so `docker compose down` does not take the data with it.
  cloud-data:
