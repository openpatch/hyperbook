name: Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Guard test-safety rules
        # No rm -r with unquoted globs in scripts; no hard-coded ports or the
        # real database.sqlite in platforms/cloud e2e files. Dependency-free,
        # so it runs before install. See platforms/cloud/AGENTS.md.
        run: node scripts/guard-test-safety.mjs
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build
      - name: Test packages
        run: pnpm test
      - name: Test CDN publishing
        run: pnpm test:cdn
