packages:
  - packages/*
  - templates/*
  - platforms/*
  - '!**/test/**'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@vscode/vsce-sign': true
  better-sqlite3: true
  esbuild: true
  h5p-standalone: true
  keytar: true
  sharp: true

ignoredBuiltDependencies:
  - esbuild

# Our own packages. The release-age guard is there to slow down a compromised
# upstream release reaching us; it does not apply to packages published from
# our own repositories, and waiting a day to consume one would mean a change
# that spans two repositories cannot be finished in one sitting.
minimumReleaseAgeExclude:
  - '@bitflow/*'
  - '@java-memory-playground/*'
  - '@learningmap/*'
  - struktolab

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@vscode/vsce-sign'
  - better-sqlite3
  - sharp

# One copy of CodeMirror's core: extensions only work with the instance of
# @codemirror/state and view they were made with.
overrides:
  '@codemirror/state': ^6.7.6
  '@codemirror/view': ^6.43.15
  '@codemirror/language': ^6.13.1
